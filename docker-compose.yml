services:
  db:
    image: postgres:14
    environment:
      POSTGRES_DB: ovalytics
      POSTGRES_USER: ovalytics
      POSTGRES_PASSWORD: ovalytics
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ovalytics -d ovalytics"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ovalytics
      SPRING_DATASOURCE_USERNAME: ovalytics
      SPRING_DATASOURCE_PASSWORD: ovalytics
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
