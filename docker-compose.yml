services:
  db:
    image: postgres:14
    environment:
      POSTGRES_DB: ovalytics
      POSTGRES_USER: ovalytics
      POSTGRES_PASSWORD: ovalytics
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ovalytics -d ovalytics"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ovalytics
      PGUSER: ovalytics
      PGPASSWORD: ovalytics
    volumes:
      - ./data/import:/import
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
