services:
  db:
    image: postgres:14
    environment:
      POSTGRES_DB: ovalytics
      POSTGRES_USER: ovalytics
      POSTGRES_PASSWORD: ovalytics
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ovalytics -d ovalytics"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ovalytics
      SPRING_DATASOURCE_USERNAME: ovalytics
      SPRING_DATASOURCE_PASSWORD: ovalytics
      OVALYTICS_IMPORT_FILE: /import/top14-matches.csv
      OVALYTICS_IMPORT_PROD2_FILE: /import/prod2-matches.csv
      OVALYTICS_IMPORT_NEWS_FILE: /import/news.csv
      OVALYTICS_IMPORT_TRANSFER_FILE: /import/transfers.csv
      OVALYTICS_IMPORT_SQUAD_FILE: /import/squads.csv
      OVALYTICS_IMPORT_PLAYER_PROFILE_FILE: /import/player-profiles.csv
      OVALYTICS_LIVE_SCORES_ENABLED: "true"
      OVALYTICS_TEAM_REFRESH_ENABLED: "true"
      OVALYTICS_TEAM_REFRESH_SCRAPE_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/import:/import

volumes:
  pgdata:
