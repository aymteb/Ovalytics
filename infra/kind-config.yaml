kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ovalytics
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          certSANs:
            - "host.docker.internal"
            - "127.0.0.1"
            - "localhost"
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8082
        protocol: TCP
