spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5432/ovalytics
    username: aymteb
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false
  ai:
    model:
      chat: google-genai
    google:
      genai:
        api-key: ${OVALYTICS_ANALYSIS_API_KEY:${GEMINI_API_KEY:}}
        chat:
          options:
            model: ${OVALYTICS_ANALYSIS_MODEL:gemini-3.1-flash-lite}
            temperature: 0.2

ovalytics:
  import:
    file: ../data/import/top14-matches.csv
    h2h-file: ../data/import/top14-h2h.csv
    news:
      file: ../data/import/news.csv
      retain-days: 7
    transfer:
      file: ../data/import/transfers.csv
    prod2:
      file: ../data/import/prod2-matches.csv
      h2h-file: ../data/import/prod2-h2h.csv
    nationale:
      file: ../data/import/nationale-matches.csv
      h2h-file: ../data/import/nationale-h2h.csv
    foreign:
      ercc-file: ../data/import/champions-cup-matches.csv
      erch-file: ../data/import/challenge-cup-matches.csv
      urc-file: ../data/import/urc-matches.csv
      prem-file: ../data/import/premiership-matches.csv
      int-file: ../data/import/international-matches.csv
      ercc-h2h-file: ../data/import/champions-cup-h2h.csv
      erch-h2h-file: ../data/import/challenge-cup-h2h.csv
      urc-h2h-file: ../data/import/urc-h2h.csv
      prem-h2h-file: ../data/import/premiership-h2h.csv
    squad:
      file: ../data/import/squads.csv
    player-profile:
      file: ../data/import/player-profiles.csv
    player-appearance:
      file: ../data/import/player-appearances.csv
    absence:
      file: ../data/import/absences.csv
  live-scores:
    enabled: true
    poll-interval-ms: 60000
    user-agent: Ovalytics/1.0
    incrowd-api-key: zDiLQ9o18oVrwn30etwT
    incrowd-realm: prl
    incrowd-app-id: web
  team-refresh:
    enabled: true
    cron: "0 0 23 * * *"
    scrape-enabled: true
    repo-root: ..
    profiles-output: data/import/player-profiles.csv
    python-command: python3
  calendar-sync:
    enabled: false
    cron: "0 30 6 * * *"
    scrape-enabled: true
    repo-root: ..
    python-command: python3
    top14-output: data/import/top14-matches.csv
    prod2-output: data/import/prod2-matches.csv
    nationale-output: data/import/nationale-matches.csv
  news-sync:
    enabled: false
    cron: "0 0 */2 * * *"
    scrape-enabled: true
    repo-root: ..
    python-command: python3
    output: data/import/news.csv
    max-age-days: 1
  absence-sync:
    enabled: false
    cron: "0 0 8,18 * * *"
    scrape-enabled: true
    repo-root: ..
    python-command: python3
    output: data/import/absences.csv
  h2h-sync:
    enabled: false
    cron: "0 0 7 * * *"
    scrape-enabled: true
    repo-root: ..
    python-command: python3
    top14-output: data/import/top14-h2h.csv
    prod2-output: data/import/prod2-h2h.csv
    nationale-output: data/import/nationale-h2h.csv
    ercc-output: data/import/champions-cup-h2h.csv
    erch-output: data/import/challenge-cup-h2h.csv
    urc-output: data/import/urc-h2h.csv
    prem-output: data/import/premiership-h2h.csv
    event-ids-file: data/import/h2h-event-ids.txt
    days-ahead: 45
  analysis:
    enabled: true
    cron: "0 0 9 * * *"
    catch-up-on-startup: false
    api-key: ${OVALYTICS_ANALYSIS_API_KEY:${GEMINI_API_KEY:}}
  cors:
    allowed-origins: http://localhost:4200
