spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5432/ovalytics
    username: aymteb
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

ovalytics:
  import:
    file: ../data/import/top14-matches.csv
    news:
      file: ../data/import/news.csv
    transfer:
      file: ../data/import/transfers.csv
    prod2:
      file: ../data/import/prod2-matches.csv
    squad:
      file: ../data/import/squads.csv
    player-profile:
      file: ../data/import/player-profiles.csv
    player-appearance:
      file: ../data/import/player-appearances.csv
    absence:
      file: ../data/import/absences.csv
  live-scores:
    enabled: true
    poll-interval-ms: 60000
    user-agent: Ovalytics/1.0
  team-refresh:
    enabled: true
    cron: "0 0 23 * * *"
    scrape-enabled: true
    repo-root: ..
    profiles-output: data/import/player-profiles.csv
    python-command: python3
  calendar-sync:
    enabled: false
    cron: "0 30 6 * * *"
    scrape-enabled: true
    repo-root: ..
    python-command: python3
    top14-output: data/import/top14-matches.csv
    prod2-output: data/import/prod2-matches.csv
  news-sync:
    enabled: false
    cron: "0 0 */2 * * *"
    scrape-enabled: true
    repo-root: ..
    python-command: python3
    output: data/import/news.csv
  analysis:
    enabled: true
    cron: "0 0 9 * * TUE"
    window-days: 7
    catch-up-on-startup: false
    api-key: ${OVALYTICS_ANALYSIS_API_KEY:}
    base-url: https://api.openai.com/v1
    model: gpt-4o-mini
  cors:
    allowed-origins: http://localhost:4200
