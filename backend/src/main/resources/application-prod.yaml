server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT:5432}/${PGDATABASE}?sslmode=require
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver

ovalytics:
  import:
    file: /import/top14-matches.csv
    news:
      file: /import/news.csv
    transfer:
      file: /import/transfers.csv
    prod2:
      file: /import/prod2-matches.csv
    squad:
      file: /import/squads.csv
    player-profile:
      file: /import/player-profiles.csv
    player-appearance:
      file: /import/player-appearances.csv
    absence:
      file: /import/absences.csv
  live-scores:
    enabled: true
  team-refresh:
    enabled: true
    scrape-enabled: false
  analysis:
    enabled: true
    catch-up-on-startup: false
    api-key: ${OVALYTICS_ANALYSIS_API_KEY:}
  cors:
    allowed-origins: ${OVALYTICS_CORS_ORIGINS:*}
