server:
  port: ${PORT:8080}
  address: "::"

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  ai:
    model:
      chat: google-genai
    google:
      genai:
        api-key: ${OVALYTICS_ANALYSIS_API_KEY:${GEMINI_API_KEY:}}
        chat:
          options:
            model: ${OVALYTICS_ANALYSIS_MODEL:gemini-3.1-flash-lite}
            temperature: 0.2

ovalytics:
  import:
    file: /import/top14-matches.csv
    h2h-file: /import/top14-h2h.csv
    news:
      file: /import/news.csv
    transfer:
      file: /import/transfers.csv
    prod2:
      file: /import/prod2-matches.csv
      h2h-file: /import/prod2-h2h.csv
    squad:
      file: /import/squads.csv
    player-profile:
      file: /import/player-profiles.csv
    player-appearance:
      file: /import/player-appearances.csv
    absence:
      file: /import/absences.csv
  live-scores:
    enabled: true
  team-refresh:
    enabled: true
    scrape-enabled: false
  calendar-sync:
    enabled: true
    scrape-enabled: true
    cron: "0 30 6 * * *"
    repo-root: /app
    python-command: python3
    top14-output: /import/top14-matches.csv
    prod2-output: /import/prod2-matches.csv
  news-sync:
    enabled: true
    scrape-enabled: true
    cron: "0 0 */2 * * *"
    repo-root: /app
    python-command: python3
    output: /import/news.csv
  absence-sync:
    enabled: true
    scrape-enabled: true
    cron: "0 0 8,18 * * *"
    repo-root: /app
    python-command: python3
    output: /import/absences.csv
  analysis:
    enabled: true
    catch-up-on-startup: false
    api-key: ${OVALYTICS_ANALYSIS_API_KEY:${GEMINI_API_KEY:}}
  cors:
    allowed-origins: ${OVALYTICS_CORS_ORIGINS:*}
