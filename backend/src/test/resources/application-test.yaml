spring:
  datasource:
    url: jdbc:h2:mem:ovalytics;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

ovalytics:
  import:
    file: ""
    news:
      file: ""
    transfer:
      file: ""
    prod2:
      file: ""
    squad:
      file: ""
    player-profile:
      file: ""
    player-appearance:
      file: ""
    absence:
      file: ""
  live-scores:
    enabled: false
  team-refresh:
    enabled: false
    scrape-enabled: false
